name: Descobrir links nas farmácias

on:
  push:
    branches: [ccr-2fcc1f67-5a0thf]
    paths: ['.github/scripts/lojas.py', '.github/workflows/lojas.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lojas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/lojas.py
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add -f _lojas
          git commit -m "Links das farmácias" || exit 0
          git pull --rebase -q || true
          git push
