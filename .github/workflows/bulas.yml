name: Baixar bulas (Anvisa)

on:
  push:
    branches: [ccr-2fcc1f67-5a0thf]
    paths: ['.github/scripts/bulas.sh', '.github/workflows/bulas.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bulas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: bash .github/scripts/bulas.sh
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add -f _bulas
          git commit -m "Bulas baixadas da Anvisa" || exit 0
          git push
